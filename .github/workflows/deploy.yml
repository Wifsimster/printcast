name: Deploy — homelab

# Runs on the self-hosted runner alongside the target docker host. Fires
# after the upstream image-publishing workflow succeeds on main, pulls
# `:latest`, reconciles the compose stack, and prunes dangling images.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-homelab-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull & reconcile
    runs-on: [self-hosted]
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: /opt/docker/printcast
    steps:
      # The self-hosted runner shares one Docker credential store across every
      # repo that deploys here. A sibling repo's workflow can leave its own
      # short-lived, repo-scoped `ghs_` token in ~/.docker/config.json, and an
      # anonymous-capable pull then fails with `error from registry: denied`.
      # Authenticate with this repo's token, and always drop it again below.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest image(s)
        run: docker compose pull

      - name: Reconcile stack
        run: docker compose up -d

      - name: Show status
        run: docker compose ps

      - name: Prune dangling images
        working-directory: /
        run: docker image prune -f

      # Never leave this run's repo-scoped token behind for the next repo.
      - name: Log out of GHCR
        if: always()
        working-directory: /
        run: docker logout ghcr.io
